name: Deployment Updates Bot

on:
  #schedule:
    # IST (UTC+5:30) converted to UTC
    # 09:00 IST = 03:30 UTC
    # 11:00 IST = 05:30 UTC
    # 13:00 IST = 07:30 UTC
    # 15:00 IST = 09:30 UTC
    # 17:00 IST = 11:30 UTC
    # 19:00 IST = 13:30 UTC
    # 21:00 IST = 15:30 UTC
    #- cron: '30 3,5,7,9,11,13,15 * * *'
    
  workflow_dispatch: {} 

jobs:
  deployment-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client vertexai requests

      - name: Inject GCP Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > gcp_keys.json

      - name: Run Deployment Bot
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json 
          WEBHOOK_URL: ${{ secrets.GC_WEBHOOK_URL }}
        run: python deployment_bot.py

      - name: Save Bot State Files (Auto-Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update bot execution states"
          file_pattern: "*.txt"