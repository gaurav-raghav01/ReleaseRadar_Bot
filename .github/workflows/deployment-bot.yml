name: Deployment Updates Bot

on:
  workflow_dispatch: {}

jobs:
  deployment-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jira-python
          pip install google-auth google-api-python-client vertexai requests jira

      - name: Inject GCP Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > gcp_keys.json

      - name: Run Deployment Bot
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json
          WEBHOOK_URL: ${{ secrets.PROD_GC_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python deployment_bot.py

      - name: Save Bot State Files (Auto-Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update bot execution states [skip ci]"
          file_pattern: "*.txt"
