name: Jira 5-Min Sheet Sync

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jira-python
          pip install gspread jira requests google-auth google-api-python-client vertexai
      - name: Inject GCP Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > gcp_keys.json
      - name: Run 5-Min Sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json
          WEBHOOK_URL: ${{ secrets.GC_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python jira_sync_tracker.py
      - name: Save Cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sheet status cache [skip ci]"
          file_pattern: "sheet_last_status_cache.json"
