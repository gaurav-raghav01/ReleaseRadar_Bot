name: ReleaseRadar Bot - Integrated

on:
  schedule:
    - cron: '*/30 3-14 * * 1-5'
  workflow_dispatch: {}

jobs:
  run-release-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for the new Google Auth action

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- THE FIX IS HERE: Add Google Auth Step ---
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          # This explicitly requests the scopes needed to write to Sheets and Drive
          scopes: |-
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/drive
            https://www.googleapis.com/auth/spreadsheets
      # --- End of Fix ---

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jira-python
          pip install gspread jira requests google-auth google-api-python-client vertexai

      # Note: We no longer need the "Inject GCP Credentials" step because the 'google-github-actions/auth'
      # step handles setting up the environment for ADC automatically.

      - name: Run Integrated ReleaseRadar Bot
        env:
          WEBHOOK_URL: ${{ secrets.GC_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # The GOOGLE_APPLICATION_CREDENTIALS env var is now set by the Google Auth action
        run: python jira_deployment_bot.py
