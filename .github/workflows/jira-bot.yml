name: ReleaseRadar Bot - Integrated

on:
  schedule:
    # Runs every 30 minutes on weekdays (IST) during business hours
    - cron: '*/30 3-14 * * 1-5'
  workflow_dispatch: {} # Allows manual runs

jobs:
  run-release-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # --- THE FIX IS HERE ---
          # Force uninstall the wrong 'jira-python' library first
          pip uninstall -y jira-python
          # Now, install the correct libraries
          pip install gspread oauth2client jira requests google-auth google-api-python-client vertexai

      - name: Inject GCP Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > gcp_keys.json

      - name: Run Integrated ReleaseRadar Bot
        # --- IMPORTANT: Change this to run the correct, single script ---
        env:
          WEBHOOK_URL: ${{ secrets.PROD_GC_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json
        run: python jira_deployment_bot.py # Use the new integrated script
