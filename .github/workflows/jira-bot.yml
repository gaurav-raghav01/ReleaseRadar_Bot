name: Jira Deployment Bot

on:
  schedule:
    # Staggered by 5 mins to prevent Git push conflicts with the Sheets bot
    # Runs at 9:05, 11:05, 13:05, 15:05, 17:05, 19:05, 21:05 IST
    - cron: '35 3,5,7,9,11,13,15 * * *'
    
  workflow_dispatch: {} # Explicit empty object prevents YAML linter errors for UI triggers

jobs:
  jira-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for auto-commit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client vertexai requests

      - name: Inject GCP Credentials
        # Securely maps multi-line JSON secret to env var to prevent Bash string syntax errors
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > gcp_keys.json

      - name: Run Jira Bot
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json 
          WEBHOOK_URL: ${{ secrets.GC_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python jira_deployment_bot.py

      - name: Save Jira State Files (Auto-Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jira bot state"
          file_pattern: "jira_*.txt" # Only commits Jira state files