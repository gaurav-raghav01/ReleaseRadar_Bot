name: ReleaseRadar Bot - Integrated

on:
  schedule:
    - cron: '*/30 3-14 * * 1-5'
  workflow_dispatch: {}

jobs:
  run-release-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jira-python
          pip install gspread jira requests google-auth google-api-python-client vertexai

      # --- THIS IS THE CORRECT METHOD FOR YOUR CREDENTIALS ---
      - name: Inject GCP Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > gcp_keys.json
      # --- End of Fix ---

      - name: Run Integrated ReleaseRadar Bot
        env:
          # This tells all Google libraries to use the file we just created
          GOOGLE_APPLICATION_CREDENTIALS: gcp_keys.json
          
          # Other secrets
          WEBHOOK_URL: ${{ secrets.GC_WEBHOOK_URL }} # Using the non-prod webhook for testing
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python jira_deployment_bot.py
